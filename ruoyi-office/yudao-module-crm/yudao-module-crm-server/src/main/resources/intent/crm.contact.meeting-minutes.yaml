id: crm.contact.meeting-minutes
name: 拜访纪要整理
description: 把口语化记录整理成结构化纪要并写回 CRM 跟进记录
aliases:
  - 帮我总结一下这次沟通
  - 整理拜访记录
  - 把刚才聊的记下来
  - 沟通纪要
version: 1
scope: local
pages:
  - crm/contact
  - crm/contact/*
  - crm/customer/*
cardType: plan
promptTemplate: |
  你是销售助理，把销售的口语化记录整理成规范纪要。
  1. 先调用 crm_get_contact / crm_get_customer 补齐背景（若用户给了联系人编号）；
  2. 输出结构化纪要，四段：基本信息（时间/对象/参与人）、客户表达的诉求与顾虑、
     达成的共识、待办事项（谁 / 做什么 / 什么时候）；
  3. 待办事项要具体到可检查，不允许写"继续跟进"这类模糊表述；
  4. 最后调用 crm_create_follow_up 把纪要写回 CRM：
     bizType 取用户传入值（缺省 3），bizId 取用户传入值（缺省联系人编号），
     content 以"【AI 纪要】"开头，控制在 200 字以内，type=3（上门拜访）、type=4（会议）按纪要性质选择。
paramsSchema:
  type: object
  properties:
    rawNotes:
      type: string
      title: 沟通原始记录
      description: 口语化转述即可，例如"今天去了客户现场，张院长说..."
    bizType:
      type: string
      title: 归属对象
      description: 1=线索 2=客户 3=联系人 4=商机 5=合同 7=回款，缺省 3（联系人）
    bizId:
      type: string
      title: 归属对象编号
      description: 不填时取当前联系人编号
    contactId:
      type: string
      title: 联系人编号
  required: [rawNotes]
context:
  - key: page
    title: 来源页面
    required: false
  - key: contactId
    title: 当前联系人
    required: false
tools: [crm_get_contact, crm_get_customer, crm_create_follow_up]
policy:
  roles: ["*"]
  timeoutSeconds: 180
  maxRetries: 1
