# =============================================================
# 文件名前缀 = 待办分组的展示优先级（越小越靠前；面板默认只并排展示 5 组）
# CRM 事实规则：分配给我的客户未跟进 → 提示 + 一键健康度诊断
#
# 一条规则 = 查询(dataset) + 条件(filter) + 输出模板(badge/items) + 参数映射(params)
# 事实由 CrmIntentFactProvider 供给（口径与「待办事项」页一致）。
# 改文案、改阈值、改挂载页面只动本文件即可。
# =============================================================
- id: crm.customer.follow
  intent: crm.customer.health-check
  dataset: crm.follow-customers
  scope:
    page: ["crm/customer", "crm/customer/*", "crm/backlog", ""]
  badge:
    text: "{{count}} 位客户待跟进"
    level: warning
  items:
    limit: 5
    title: "客户「{{row.name}}」待跟进"
    subtitle: "上次联系 {{row.contactLastTime | date}}"
    reason: "分配给我的客户还没完成跟进，建议先做一次健康度诊断再动身"
    params:
      customerId: { from: row.id, type: string }
