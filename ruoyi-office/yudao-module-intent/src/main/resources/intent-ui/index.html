<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>意图工作台 · ruoyi-office</title>
  <link rel="stylesheet" href="css/workbench.css">
</head>
<body>
<!--
  意图工作台（宿主页面，零构建）

  与旧形态的区别：这里<b>没有浮球</b>，也没有"某个业务页面的侧边栏"。
  它是一个独立入口，左侧是「用户真正想做什么」的六块，右侧是执行流。
  取代浮球的四个入口：顶栏常驻（本站） + ⌘K 命令面板 + 业务页「送到工作台」+ 待办深链。
-->
<div class="screen">

  <div class="topbar">
    <div class="brand"><span class="logo">RC</span><span id="brand-name">企业管理一体化平台</span></div>
    <div class="nav">
      <span>工作台</span><span>流程中心</span><span>OA协同办公</span><span>人力资源管理</span>
      <span class="on">意图工作台 <b class="navbadge" id="nav-badge" hidden>0</b></span>
    </div>
    <div class="top-right">
      <div class="viewswitch" id="view-switch" title="视角只能收窄你能做的事，不会放大">
        <span class="vt">视角</span><span id="view-label">我自己</span><span class="caret">▾</span>
        <div class="vmenu" id="view-menu" hidden></div>
      </div>
      <div class="cmdk" id="cmdk-open" data-act="open-palette">
        <span>搜索意图、对象，或直接说一句…</span><span class="kbd">Ctrl K</span>
      </div>
      <div class="userswitch" id="user-switch" title="当前账号：换个账号就是换一份装配">
        <div class="avatar" id="avatar">·</div>
        <div class="umenu" id="user-menu" hidden></div>
      </div>
    </div>
  </div>

  <!--
    上下文通栏（横跨整页）。
    为什么从"左栏顶部 + 右栏快照"两处合并到这里：它同时驱动左栏（能用什么）与右栏（跑出什么），
    本来就属于"整个工作台的状态"，不是某一栏的子块；分开放还会出现两份一模一样的上下文
    ——左栏写「时间窗 近90天」、右栏写「时间窗 = 近90天」，用户看到的是同一件事说两遍。
  -->
  <div class="ctxbar" id="ctxbar"></div>

  <div class="body">
    <div class="left" id="left">
      <div class="loading">加载中…</div>
    </div>

    <!--
      中间区 = 意图网络。
      它回答的是"做完接着做什么"，与左栏的"现在做什么"是两个问题、两条轴：
      左栏的一行是**事项**，网络的一个节点是**能力**；两者靠 `intentId` 投影连接，
      界面上靠"两边写同一个意图名 + 焦点同步高亮"让这条投影看得见。

      原来这里是执行流。执行流没有丢，它被收进了右侧抽屉（#gdrawer）——
      抽屉与网络是**并列**的（不是浮层遮住图）：打开时网络自己收窄，列距跟着变。
      关掉抽屉时，中间 100% 是网络。
    -->
    <div class="graph" id="graph">
      <div class="ghead" id="ghead"></div>
      <div class="gbody">
        <div class="gcanvas" id="gcanvas"></div>
        <div class="gdrawer" id="gdrawer"></div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/workbench.js"></script>
</body>
</html>
