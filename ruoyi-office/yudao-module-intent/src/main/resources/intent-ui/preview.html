/** 假请求器：按路径路由到 fixture。这就是宿主注入自己 HTTP 客户端的位置。 */
async function fixtureFetcher(path, { method, body } = {}) {
  const url = new URL(path, 'http://fixture.local');
  const p = url.pathname;
  const q = url.searchParams;
  if (p.endsWith('/intent/me')) return ME;
  if (p.endsWith('/intent/runs')) return RUNS;
  if (p.endsWith('/intent/catalog')) return { systemName: ME.systemName, gatewayStatus: 'ENABLED', entries: ENTRIES, suggestions: SUGGESTIONS, issues: [] };
  if (p.endsWith('/intent/slots/resolve')) {
    // 契约是按 type 索引（一个类型只回一个），所以这里回的条数与请求里出现的类型数一致
    const requested = Array.isArray(body) ? body : [];
    const out = {};
    for (const ref of requested) {
      const hit = CANDIDATES.find((c) => c.id === String(ref.id)) ?? CANDIDATES[0];
      out[ref.type] = { type: ref.type, id: String(ref.id), name: hit.name, accessible: true };
    }
    return out;
  }
  if (p.endsWith('/intent/slots/candidates')) {
    const keyword = (q.get('keyword') || '').trim();
    const hit = keyword ? CANDIDATES.filter((c) => c.name.includes(keyword)) : CANDIDATES;
    const limit = Number(q.get('limit') || 10);
    const page = Number(q.get('cursor') || 1);
    const slice = hit.slice((page - 1) * limit, page * limit);
    return { items: slice, nextCursor: page * limit < hit.length ? String(page + 1) : null, total: hit.length };
  }
  if (p.endsWith('/intent/execute')) {
    await new Promise((r) => setTimeout(r, 900));
    return {
      traceId: `preview-${Date.now()}`, intentId: 'preview', status: 'SUCCESS', durationMs: 900,
      executorType: 'agent', usage: { inputTokens: 6200, outputTokens: 1800, totalTokens: 8000 },
      steps: [
        { tool: 'crm_get_customer', argsSummary: 'customerId=320', resultSummary: '命中 1 条', ok: true, durationMs: 42 },
        { tool: 'crm_customer_facts', argsSummary: 'customerId=320', resultSummary: '在手商机 1 / 合同 3 / 回款 0', ok: true, durationMs: 118 },
      ],
      output: {
        title: '客户健康度诊断',
        summary: '宏图建筑设计院有限公司 62/100，评级「关注」：跟进频次偏低，商机集中度高。',
        blocks: [
          { kind: 'kv', title: '八维评分', items: [{ label: '跟进频次', value: '48' }, { label: '商机健康', value: '71' }, { label: '回款表现', value: '80' }, { label: '综合', value: '62' }] },
          { kind: 'text', title: '改进项（3）', text: '1. 30 天内补一次上门拜访；\n2. 在手商机仅 1 个，建议从「智慧工地」需求切入扩品；\n3. 建立第二联系人，降低单点依赖。' },
        ],
        followups: ['再改一版：语气更正式一些'],
        // 生产信封里意图名是 title（不是 name）——fixture 必须跟生产同形状，
        // 否则预览页会渲染成裸 intentId，看着像 bug 其实只是假数据写错了字段
        nextIntents: [{ intentId: 'crm.contract.renewal-plan', title: '续约策略', reason: '这份合同还有 45 天到期' }],
      },
    };
  }
  return null;
}

mountWorkbench({ container: '#wb', token: 'preview-token', fetcher: fixtureFetcher });
</script>
